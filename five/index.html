<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Биэс ойбон</title>
<style>
  :root {
    --wood-light: #e8c896;
    --wood-dark: #a8763f;
    --hole-color: #3a2718;
    --bg-top: #2b1d12;
    --bg-bottom: #120c07;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-top), var(--bg-bottom));
    overflow: hidden;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f0e6d6;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: env(safe-area-inset-top, 10px) 16px 6px;
    box-sizing: border-box;
    z-index: 5;
  }
  header h1 {
    font-size: 18px; margin: 0; letter-spacing: 1px;
    color: #f0e6d6; text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #stats { font-size: 15px; font-variant-numeric: tabular-nums; opacity: .9; }
  #boardWrap {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  canvas {
    touch-action: none;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.55), inset 0 0 0 2px rgba(0,0,0,.25);
  }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(10,7,4,.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 20; text-align: center; padding: 24px;
  }
  #overlay .card {
    max-width: 340px;
  }
  #overlay h2 { margin: 0 0 10px; font-size: 24px; }
  #overlay p { line-height: 1.5; opacity: .85; font-size: 14px; margin: 0 0 20px; }
  button.big {
    background: linear-gradient(180deg, var(--wood-light), var(--wood-dark));
    color: #2b1d12; border: none; border-radius: 12px;
    padding: 14px 28px; font-size: 16px; font-weight: 600;
    box-shadow: 0 4px 0 #6b4a26, 0 8px 14px rgba(0,0,0,.4);
    cursor: pointer;
  }
  button.big:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b4a26; }
  #hint { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 12px; opacity: .5; z-index: 4;}
  #modeTag {
    position: fixed; top: env(safe-area-inset-top, 10px); left: 50%; transform: translateX(-50%);
    font-size: 11px; background: rgba(0,0,0,.4); padding: 3px 10px; border-radius: 20px; opacity: .7;
    z-index: 6;
  }
  #levelTag {
    position: fixed; top: calc(env(safe-area-inset-top, 10px) + 26px); left: 50%; transform: translateX(-50%);
    font-size: 11px; background: rgba(0,0,0,.3); padding: 3px 10px; border-radius: 20px; opacity: .7;
    z-index: 6;
  }
  #winCard { display: none; }
  #winCard.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Биэс ойбон</h1>
    <div id="stats">⏱ <span id="time">0.0</span>с &nbsp; ●<span id="filled">0</span>/<span id="totalHoles">5</span></div>
  </header>
  <div id="modeTag">режим: —</div>
  <div id="levelTag">уровень —</div>
  <div id="boardWrap">
    <canvas id="board"></canvas>
  </div>
  <div id="hint">Наклоняй телефон, чтобы закатить все шарики в лунки</div>
</div>

<div id="overlay">
  <div class="card" id="startCard">
    <h2>Биэс ойбон</h2>
    <p>Пять шариков — пять лунок. Наклоняй телефон (гироскоп), чтобы закатить все шарики в лунки. Руками шариков касаться нельзя — только наклон!</p>
    <button class="big" id="startBtn">Начать игру</button>
  </div>
  <div class="card" id="winCard">
    <h2>Готово! 🎉</h2>
    <p>Все шарики в лунках за <b><span id="finalTime">0.0</span> с</b></p>
    <button class="big" id="againBtn">Играть снова</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const timeEl = document.getElementById('time');
  const filledEl = document.getElementById('filled');
  const totalHolesEl = document.getElementById('totalHoles');
  const modeTag = document.getElementById('modeTag');
  const levelTag = document.getElementById('levelTag');
  const overlay = document.getElementById('overlay');
  const startCard = document.getElementById('startCard');
  const winCard = document.getElementById('winCard');
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const finalTimeEl = document.getElementById('finalTime');

  // ---- board geometry (design space, scaled to canvas) ----
  const DESIGN_W = 400, DESIGN_H = 640;
  const BALL_R = 15;
  const HOLE_R = 19;
  const WALL = 12;

  // ---- levels (loaded from levels.json, matrix of hole coordinates per level) ----
  const DEFAULT_LEVELS = [
    { name: 'Пирамида', holes: [
      {x: 200, y: 150},
      {x: 150, y: 230}, {x: 250, y: 230},
      {x: 130, y: 310}, {x: 270, y: 310}
    ] }
  ];
  let LEVELS = DEFAULT_LEVELS;
  let levelIndex = 0;
  let holes = [];
  let balls = [];

  // balls start in a row near the bottom trough, evenly spread to match hole count
  function makeBalls(holesArr){
    const n = holesArr.length;
    const marginX = WALL + BALL_R + 6;
    const usableW = DESIGN_W - marginX * 2;
    const arr = [];
    for (let i = 0; i < n; i++) {
      const x = n === 1 ? DESIGN_W / 2 : marginX + usableW * (i / (n - 1));
      arr.push({x, y: 560, vx: 0, vy: 0});
    }
    return arr;
  }

  function setupLevel(idx){
    levelIndex = ((idx % LEVELS.length) + LEVELS.length) % LEVELS.length;
    const lvl = LEVELS[levelIndex];
    holes = lvl.holes.map(h => ({x: h.x, y: h.y, filled: false}));
    totalHolesEl.textContent = holes.length;
    levelTag.textContent = 'уровень ' + (levelIndex + 1) + '/' + LEVELS.length + (lvl.name ? ' — ' + lvl.name : '');
  }

  setupLevel(0);

  fetch('levels.json')
    .then(r => r.json())
    .then(data => {
      if (data && Array.isArray(data.levels) && data.levels.length) {
        LEVELS = data.levels;
        setupLevel(0);
      }
    })
    .catch(() => { /* keep DEFAULT_LEVELS */ });

  let scale = 1, offX = 0, offY = 0;
  function resize(){
    const wrap = document.getElementById('boardWrap');
    const maxW = wrap.clientWidth - 20;
    const maxH = wrap.clientHeight - 20;
    scale = Math.min(maxW / DESIGN_W, maxH / DESIGN_H);
    canvas.width = DESIGN_W * scale * devicePixelRatio;
    canvas.height = DESIGN_H * scale * devicePixelRatio;
    canvas.style.width = (DESIGN_W * scale) + 'px';
    canvas.style.height = (DESIGN_H * scale) + 'px';
    ctx.setTransform(scale * devicePixelRatio, 0, 0, scale * devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- tilt input ----
  let tiltX = 0, tiltY = 0; // gravity direction in board space (-1..1)
  let usingGyro = false;

  function handleOrientation(e){
    // desktop browsers without a real sensor still fire deviceorientation
    // with beta/gamma == null — ignore those instead of "locking in" a dead gyro
    if (e.beta == null && e.gamma == null) return;
    // beta: front-back tilt (-180..180), gamma: left-right tilt (-90..90)
    const beta = e.beta || 0;
    const gamma = e.gamma || 0;
    const clamp = (v, lim) => Math.max(-lim, Math.min(lim, v));
    tiltX = clamp(gamma, 35) / 35;
    tiltY = clamp(beta - 20, 35) / 35; // subtract ~20deg for comfortable holding angle
    usingGyro = true;
    modeTag.textContent = 'режим: гироскоп';
  }

  // fallback: mouse/touch drag simulates tilt, keyboard arrows too
  let usingPointerFallback = false;
  function setupFallback(){
    let dragging = false;
    canvas.addEventListener('pointerdown', e => { dragging = true; });
    window.addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('pointermove', e => {
      if (usingGyro) return;
      const rect = canvas.getBoundingClientRect();
      const cx = rect.left + rect.width/2;
      const cy = rect.top + rect.height/2;
      const nx = (e.clientX - cx) / (rect.width/2);
      const ny = (e.clientY - cy) / (rect.height/2);
      tiltX = Math.max(-1, Math.min(1, nx));
      tiltY = Math.max(-1, Math.min(1, ny));
      usingPointerFallback = true;
      modeTag.textContent = 'режим: мышь/тач (наклон эмулирован)';
    });
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    setInterval(() => {
      if (usingGyro) return;
      if (keys['ArrowLeft'] || keys['ArrowRight'] || keys['ArrowUp'] || keys['ArrowDown']) {
        let tx = (keys['ArrowRight']?1:0) - (keys['ArrowLeft']?1:0);
        let ty = (keys['ArrowDown']?1:0) - (keys['ArrowUp']?1:0);
        tiltX = tx; tiltY = ty;
        usingPointerFallback = true;
        modeTag.textContent = 'режим: клавиатура (наклон эмулирован)';
      }
    }, 16);
  }

  async function enableGyro(){
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          return true;
        }
      } catch (err) {
        console.warn('gyro permission error', err);
      }
      return false;
    } else if ('DeviceOrientationEvent' in window) {
      // desktop browsers report DeviceOrientationEvent as defined even with
      // no physical sensor, and often fire one empty (null beta/gamma) event
      // just for API compatibility — wait for a real reading before trusting it
      return await new Promise(resolve => {
        let resolved = false;
        function onReading(e){
          if (e.beta == null && e.gamma == null) return; // not a real reading, keep waiting
          resolved = true;
          window.removeEventListener('deviceorientation', onReading);
          window.addEventListener('deviceorientation', handleOrientation);
          handleOrientation(e);
          resolve(true);
        }
        window.addEventListener('deviceorientation', onReading);
        setTimeout(() => {
          if (resolved) return;
          window.removeEventListener('deviceorientation', onReading);
          resolve(false);
        }, 600);
      });
    }
    return false;
  }

  // ---- physics ----
  const GRAVITY = 900; // px/s^2 at full tilt (design space)
  const FRICTION = 0.995; // per-frame velocity damping
  const RESTITUTION = 0.55;

  // hole "pocket" physics: a ball rolling near a hole gets pulled toward
  // its center and slowed by extra rolling resistance, like a real funnel.
  // it only drops in once it's deep enough AND slow enough — fast balls
  // rim around and can roll back out instead of teleporting in.
  const HOLE_CAPTURE_R = HOLE_R + BALL_R * 0.6; // radius where the pocket starts pulling
  const HOLE_DROP_R = HOLE_R - BALL_R * 0.35;   // deep enough to fall in
  const HOLE_PULL = 2600;                        // px/s^2 pull toward hole center at the rim
  const HOLE_DRAG = 0.90;                        // extra per-frame damping inside the pocket
  const HOLE_SETTLE_SPEED = 55;                  // px/s — must be this slow (at drop depth) to settle

  function stepPhysics(dt){
    const gx = tiltX * GRAVITY;
    const gy = tiltY * GRAVITY;

    for (const b of balls) {
      if (b.done) continue;
      b.vx += gx * dt;
      b.vy += gy * dt;
      b.vx *= FRICTION;
      b.vy *= FRICTION;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // walls
      if (b.x < WALL + BALL_R) { b.x = WALL + BALL_R; b.vx = -b.vx * RESTITUTION; }
      if (b.x > DESIGN_W - WALL - BALL_R) { b.x = DESIGN_W - WALL - BALL_R; b.vx = -b.vx * RESTITUTION; }
      if (b.y < WALL + BALL_R) { b.y = WALL + BALL_R; b.vy = -b.vy * RESTITUTION; }
      if (b.y > DESIGN_H - WALL - BALL_R) { b.y = DESIGN_H - WALL - BALL_R; b.vy = -b.vy * RESTITUTION; }

      // check holes: pocket pulls the ball in and adds rolling resistance;
      // only settles once the ball is deep enough and slow enough
      for (const h of holes) {
        if (h.filled) continue;
        const dx = b.x - h.x, dy = b.y - h.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        if (dist < HOLE_CAPTURE_R) {
          const nx = dx / dist, ny = dy / dist;
          const pull = HOLE_PULL * (1 - dist / HOLE_CAPTURE_R);
          b.vx -= nx * pull * dt;
          b.vy -= ny * pull * dt;
          b.vx *= HOLE_DRAG;
          b.vy *= HOLE_DRAG;

          if (dist < HOLE_DROP_R) {
            const speed = Math.hypot(b.vx, b.vy);
            if (speed < HOLE_SETTLE_SPEED) {
              h.filled = true;
              b.done = true;
              b.homeX = h.x; b.homeY = h.y;
              checkWin();
            }
          }
          break; // only one pocket affects a ball at a time
        }
      }
    }

    // ball-ball collisions (simple elastic). Balls already settled in a hole
    // stay put (homeX/homeY, zero velocity) but still occupy space — a rolling
    // ball bounces off them instead of passing through.
    const BALL_RESTITUTION = 0.85;
    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      for (let j = i+1; j < balls.length; j++) {
        const b = balls[j];
        if (a.done && b.done) continue; // both fixed, nothing to resolve

        const ax = a.done ? a.homeX : a.x, ay = a.done ? a.homeY : a.y;
        const bx = b.done ? b.homeX : b.x, by = b.done ? b.homeY : b.y;
        const dx = bx - ax, dy = by - ay;
        const dist = Math.hypot(dx, dy) || 0.001;
        const minDist = BALL_R * 2;
        if (dist >= minDist) continue;

        const nx = dx / dist, ny = dy / dist;
        const overlap = minDist - dist;
        const invA = a.done ? 0 : 1, invB = b.done ? 0 : 1;
        const invSum = invA + invB;

        // push apart only the ball(s) that are free to move
        a.x -= nx * overlap * (invA / invSum);
        a.y -= ny * overlap * (invA / invSum);
        b.x += nx * overlap * (invB / invSum);
        b.y += ny * overlap * (invB / invSum);

        const relVx = (b.done ? 0 : b.vx) - (a.done ? 0 : a.vx);
        const relVy = (b.done ? 0 : b.vy) - (a.done ? 0 : a.vy);
        const rel = relVx * nx + relVy * ny;
        if (rel < 0) {
          const imp = -(1 + BALL_RESTITUTION) * rel / invSum;
          a.vx -= imp * invA * nx; a.vy -= imp * invA * ny;
          b.vx += imp * invB * nx; b.vy += imp * invB * ny;
        }
      }
    }
  }

  let startTime = null, elapsed = 0, won = false;
  function checkWin(){
    if (holes.every(h => h.filled) && !won) {
      won = true;
      finalTimeEl.textContent = elapsed.toFixed(1);
      const hasNext = levelIndex + 1 < LEVELS.length;
      againBtn.textContent = hasNext ? 'Следующий уровень' : 'Играть снова (с 1-го уровня)';
      setTimeout(() => {
        overlay.style.display = 'flex';
        startCard.style.display = 'none';
        winCard.classList.add('show');
      }, 400);
    }
  }

  // ---- render ----
  function draw(){
    ctx.clearRect(0,0,DESIGN_W,DESIGN_H);

    // wood board background
    const grad = ctx.createLinearGradient(0,0,0,DESIGN_H);
    grad.addColorStop(0, '#e6c48d');
    grad.addColorStop(1, '#c9a165');
    ctx.fillStyle = grad;
    roundRect(0,0,DESIGN_W,DESIGN_H,16);
    ctx.fill();

    // wood grain lines
    ctx.strokeStyle = 'rgba(120,80,40,.15)';
    ctx.lineWidth = 1;
    for (let i=0;i<14;i++){
      ctx.beginPath();
      ctx.moveTo(0, 20 + i*44 + Math.sin(i)*6);
      ctx.bezierCurveTo(DESIGN_W*0.3, 15+i*44, DESIGN_W*0.7, 25+i*44, DESIGN_W, 20+i*44);
      ctx.stroke();
    }

    // inner border
    ctx.strokeStyle = 'rgba(80,50,20,.5)';
    ctx.lineWidth = 3;
    roundRect(WALL/2, WALL/2, DESIGN_W-WALL, DESIGN_H-WALL, 12);
    ctx.stroke();

    // trough line near bottom (visual only)
    ctx.strokeStyle = 'rgba(80,50,20,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(WALL+6, 520);
    ctx.lineTo(DESIGN_W-WALL-6, 520);
    ctx.stroke();

    // holes
    for (const h of holes){
      ctx.beginPath();
      ctx.arc(h.x, h.y, HOLE_R, 0, Math.PI*2);
      const hg = ctx.createRadialGradient(h.x,h.y,2,h.x,h.y,HOLE_R);
      hg.addColorStop(0, '#000000');
      hg.addColorStop(1, '#3a2718');
      ctx.fillStyle = h.filled ? '#1c130b' : hg;
      ctx.fill();
      if (h.filled) {
        ctx.beginPath();
        ctx.arc(h.x, h.y, HOLE_R*0.55, 0, Math.PI*2);
        ctx.fillStyle = '#d94f3a';
        ctx.fill();
      }
    }

    // balls
    for (const b of balls){
      const x = b.done ? b.homeX : b.x;
      const y = b.done ? b.homeY : b.y;
      ctx.beginPath();
      ctx.arc(x, y, BALL_R, 0, Math.PI*2);
      const bg = ctx.createRadialGradient(x-5,y-5,2,x,y,BALL_R);
      bg.addColorStop(0, b.done ? '#f2a08f' : '#ff6b52');
      bg.addColorStop(1, b.done ? '#a83526' : '#c22c1a');
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  let lastT = null;
  function loop(t){
    if (lastT == null) lastT = t;
    let dt = (t - lastT) / 1000;
    dt = Math.min(dt, 0.033);
    lastT = t;

    if (!won && startTime != null) {
      elapsed = (performance.now() - startTime) / 1000;
      timeEl.textContent = elapsed.toFixed(1);
      filledEl.textContent = holes.filter(h=>h.filled).length;
      stepPhysics(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  function resetGame(){
    holes.forEach(h => h.filled = false);
    balls = makeBalls(holes);
    won = false;
    startTime = performance.now();
    elapsed = 0;
    timeEl.textContent = '0.0';
    filledEl.textContent = '0';
  }

  startBtn.addEventListener('click', async () => {
    const granted = await enableGyro();
    if (!granted) {
      modeTag.textContent = 'режим: наклон недоступен — используй мышь/тач или стрелки';
    }
    overlay.style.display = 'none';
    setupLevel(0);
    resetGame();
  });

  againBtn.addEventListener('click', () => {
    winCard.classList.remove('show');
    overlay.style.display = 'none';
    const hasNext = levelIndex + 1 < LEVELS.length;
    setupLevel(hasNext ? levelIndex + 1 : 0);
    resetGame();
  });

  setupFallback();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
